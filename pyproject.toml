[project]
name = "nba-betting-agent"
version = "0.1.0"
description = "Contracts and configuration for an NBA pregame points, assists, and rebounds analysis agent."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "nba_api>=1.4,<2",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
